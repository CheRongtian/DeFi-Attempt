apiVersion: v1
kind: Secret
metadata:
  name: dlp-postgres
  namespace: dlp
type: Opaque
stringData:
  database: dlp
  username: dlp
  password: dlp
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dlp
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dlp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dlp-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dlp-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dlp-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dlp
                - -d
                - dlp
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: dlp
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: dlp
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args:
            - --jetstream
            - --store_dir
            - /data
            - --http_port
            - "8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: dlp
spec:
  type: NodePort
  selector:
    app: anvil
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      nodePort: 30545
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anvil
  template:
    metadata:
      labels:
        app: anvil
    spec:
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:latest
          command:
            - anvil
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8545"
          ports:
            - name: rpc
              containerPort: 8545
          readinessProbe:
            exec:
              command:
                - cast
                - block-number
                - --rpc-url
                - http://127.0.0.1:8545
            initialDelaySeconds: 2
            periodSeconds: 2
