apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations
  namespace: dlp
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: database-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              for migration in /migrations/*.sql; do
                psql -v ON_ERROR_STOP=1 "$DLP_DATABASE_URL" -f "$migration"
              done
          env:
            - name: DLP_DATABASE_URL
              value: postgresql://dlp:dlp@postgres:5432/dlp
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: dlp-migrations
