apiVersion: v1
kind: ConfigMap
metadata:
  name: dlp-runtime
  namespace: dlp
data:
  DLP_DATABASE_URL: postgresql://dlp:dlp@postgres:5432/dlp
  DLP_RPC_URL: http://rpc-a:8545
  DLP_RPC_PRIMARY_URL: http://rpc-a:8545
  DLP_RPC_FAILOVER_URLS: http://rpc-b:8545
  DLP_READ_RPC_URLS: http://rpc-a:8545,http://rpc-b:8545
  DLP_RPC_BROADCAST_URLS: http://rpc-a:8545,http://rpc-b:8545
  DLP_CHAIN_ID: "31337"
  DLP_NATS_URL: nats://nats:4222
  DLP_API_ADDRESS: 0.0.0.0
  DLP_API_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: dlp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      containers:
        - name: indexer
          image: dlp/indexer:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      containers:
        - name: outbox-publisher
          image: dlp/outbox-publisher:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      containers:
        - name: risk-engine
          image: dlp/risk-engine:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-manager
  namespace: dlp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tx-manager
  template:
    metadata:
      labels:
        app: tx-manager
    spec:
      containers:
        - name: tx-manager
          image: dlp/tx-manager:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - secretRef:
                name: dlp-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidator
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidator
  template:
    metadata:
      labels:
        app: liquidator
    spec:
      containers:
        - name: liquidator
          image: dlp/liquidator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
          env:
            - name: DLP_LIQUIDATOR_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oracle-coordinator
  namespace: dlp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oracle-coordinator
  namespace: dlp
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oracle-coordinator
  namespace: dlp
subjects:
  - kind: ServiceAccount
    name: oracle-coordinator
    namespace: dlp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oracle-coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-coordinator
  namespace: dlp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oracle-coordinator
  template:
    metadata:
      labels:
        app: oracle-coordinator
    spec:
      serviceAccountName: oracle-coordinator
      containers:
        - name: oracle-coordinator
          image: dlp/oracle-coordinator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
          env:
            - name: DLP_ORACLE_ASSET_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: dlp-contracts
                  key: DLP_WETH_ADDRESS
            - name: DLP_ORACLE_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: dlp
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: dlp/api-server:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /protocol/stats
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
