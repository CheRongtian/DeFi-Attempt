apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidator
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidator
  template:
    metadata:
      labels:
        app: liquidator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9105"
    spec:
      containers:
        - name: liquidator
          image: dlp/liquidator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
            - secretRef:
                name: dlp-postgres
            - secretRef:
                name: dlp-network
                optional: true
          env:
            - name: DLP_LIQUIDATOR_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DLP_METRICS_PORT
              value: "9105"
          ports:
            - name: metrics
              containerPort: 9105
          livenessProbe:
            httpGet:
