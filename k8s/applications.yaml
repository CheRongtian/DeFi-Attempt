apiVersion: v1
kind: ConfigMap
metadata:
  name: dlp-runtime
  namespace: dlp
data:
  DLP_RPC_URL: http://rpc-a:8545
  DLP_RPC_PRIMARY_URL: http://rpc-a:8545
  DLP_RPC_FAILOVER_URLS: http://rpc-b:8545
  DLP_READ_RPC_URLS: http://rpc-a:8545,http://rpc-b:8545
  DLP_RPC_BROADCAST_URLS: http://rpc-a:8545,http://rpc-b:8545
  DLP_CHAIN_ID: "31337"
  DLP_NATS_URL: nats://nats:4222
  DLP_API_ADDRESS: 0.0.0.0
  DLP_API_PORT: "8080"
  DLP_METRICS_ADDRESS: 0.0.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: dlp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9101"
    spec:
      containers:
        - name: indexer
          image: dlp/indexer:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
            - secretRef:
                name: dlp-postgres
            - secretRef:
                name: dlp-network
                optional: true
          env:
            - name: DLP_METRICS_PORT
              value: "9101"
          ports:
            - name: metrics
              containerPort: 9101
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
---
apiVersion: apps/v1
kind: Deployment
