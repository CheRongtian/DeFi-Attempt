---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oracle-coordinator
  namespace: dlp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oracle-coordinator
  namespace: dlp
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oracle-coordinator
  namespace: dlp
subjects:
  - kind: ServiceAccount
    name: oracle-coordinator
    namespace: dlp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oracle-coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-coordinator
  namespace: dlp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oracle-coordinator
  template:
    metadata:
      labels:
        app: oracle-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9107"
    spec:
      serviceAccountName: oracle-coordinator
      containers:
        - name: oracle-coordinator
          image: dlp/oracle-coordinator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - configMapRef:
                name: dlp-contracts
            - secretRef:
                name: dlp-postgres
          env:
            - name: DLP_ORACLE_ASSET_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: dlp-contracts
                  key: DLP_WETH_ADDRESS
            - name: DLP_ORACLE_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DLP_METRICS_PORT
              value: "9107"
          ports:
            - name: metrics
              containerPort: 9107
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: dlp
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9106"
    spec:
      containers:
        - name: api-server
          image: dlp/api-server:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dlp-runtime
            - secretRef:
                name: dlp-postgres
            - secretRef:
                name: dlp-network
                optional: true
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9106
          env:
            - name: DLP_METRICS_PORT
              value: "9106"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 2
