services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DLP_POSTGRES_DB:-dlp}
      POSTGRES_USER: ${DLP_POSTGRES_USER:-dlp}
      POSTGRES_PASSWORD: ${DLP_POSTGRES_PASSWORD:-dlp}
    ports:
      - "${DLP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - dlp-postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${DLP_NATS_PORT:-4222}:4222"
    volumes:
      - dlp-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dlp-postgres-data:
  dlp-nats-data:
